name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore "Day-3/Day-3 task-3/QuotesApi.IntegrationTests"
      
    - name: Build
      run: dotnet build "Day-3/Day-3 task-3/QuotesApi.IntegrationTests" --no-restore
      
    - name: Test
      run: dotnet test "Day-3/Day-3 task-3/QuotesApi.IntegrationTests" --no-build --verbosity normal
